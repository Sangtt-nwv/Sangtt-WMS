
<script src="/resources/scripts/Sortable.js"></script>
<script src="/resources/scripts/TFMMenuMakerCtrl.js"></script>
<link href="/resources/styles/TFMMenuMakerCtrl.css" rel="stylesheet" type="text/css" />
<div id="TFMMenuMakerCtrl" data-dyn-bind="sizing: { height: $data.Height, width: $data.Width }, visible: $data.Visible">
    <div style="display: block;">
        <div id="menuloader" class="loader"><img src="resources/images/loading.gif" alt="Loading" /></div>
        <div id="grid" class="row">
            <div class="col">
                <div style="display: flow-root;">
                    <span class="group_title">Menu group setup</span>
                    <span class="gridmenu-button">
                        <button onclick="GlobalObj.removeAllMenuItems()" id="removeAll">Remove all</button>
                    </span>
                </div>
                <div id="menugrid-setup" class="menugrid"></div>
            </div>
            <div class="colavail">
                <div style="display: flow-root;">
                    <span class="group_title">Available items</span>
                    <span class="gridmenu-button">
                        <button onclick="GlobalObj.addDefaultMenuItems()"><img src="resources/images/starx.png" alt="Default" /><span id="addDefaultMenuItems">Add the default menu items</span></button>
                    </span>
                </div>
                <div id="menugrid-available" class="menugrid">
                </div>
            </div>
        </div>
    </div>
</div>
